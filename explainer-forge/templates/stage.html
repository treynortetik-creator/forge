<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explainer stage</title>
<!-- One 1920x1080 stage, one paused GSAP timeline (time = narration time). render_frames.mjs seeks it frame by frame.
     Copy this, timeline.js and gsap.min.js (vendor it: offline renders must not depend on a CDN) into build/.
     Put your scenes in scenes.js. Open stage.html?play to preview with sound, ?t=42 to park at a time.
     Palette: light and warm by default. Swap the tokens for your own brand in a private copy, never in the plugin. -->
<style>
:root{--bg:#FAF5F0;--ink:#1F2A30;--muted:#5B6870;--accent:#2E7D8C;--accent-deep:#1D4E58;--hot:#E2643C;
  --card:#FFFFFF;--line:#E8E0D6;--head:system-ui,sans-serif;--body:system-ui,sans-serif;
  --sh:0 18px 50px rgba(31,42,48,.12),0 3px 10px rgba(31,42,48,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1400px 900px at 70% 20%,#FFFDFB 0%,var(--bg) 60%,#F6EEE6 100%)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh)}
/* full-screen footage: a 1920x1080 layer you can zoom with focus() */
.fs{position:absolute;inset:0;overflow:hidden;background:#fff}
.fs .inner{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.fs video,.fs img{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.ring{position:absolute;border:5px solid var(--hot);border-radius:16px;opacity:0;z-index:90}
.patch{position:absolute;display:none}
#corner{position:absolute;right:48px;top:24px;display:flex;gap:12px;z-index:60}
#badge,#sped{height:36px;border-radius:18px;padding:0 18px;font:600 18px/36px var(--head);opacity:0}
#badge{background:#FFEFE8;color:#A8401E}
#sped{background:var(--accent-deep);color:#fff;display:flex;align-items:center;gap:8px}
#sped svg{width:16px;height:16px}
/* captions: a dark translucent pill, about 40 px, at most 2 rows */
#cap{position:absolute;left:0;right:0;bottom:64px;display:flex;justify-content:center;z-index:70;pointer-events:none}
#capp{max-width:1200px;background:rgba(20,26,30,.78);color:#fff;font:600 40px/1.3 var(--body);text-align:center;
  padding:12px 28px;border-radius:18px;opacity:0}
#prog{position:absolute;left:0;bottom:0;height:5px;background:var(--accent);width:0;z-index:71;opacity:.85}
</style>
</head>
<body>
<div id="stage">

<!-- ============ 1 EXAMPLE SCENE: replace ============ -->
<section class="scene" id="s1">
  <div class="card" style="left:260px;top:300px;width:1400px;height:360px;display:grid;place-items:center">
    <h1 id="h1" style="font:800 96px/1 var(--head);color:var(--accent-deep);opacity:0">One idea per scene.</h1>
  </div>
</section>

<!-- ============ 2 EXAMPLE FOOTAGE SCENE: replace ============ -->
<section class="scene" id="s2">
  <div class="fs" id="fs2"><div class="inner">
    <!-- <video src="media/A-flow.mp4" muted preload="auto"></video> -->
    <div class="ring" id="r2a"></div>
  </div></div>
</section>

<div id="corner"><div id="sped"><svg viewBox="0 0 16 16" fill="#fff"><path d="M1 3l7 5-7 5zM8 3l7 5-7 5z"/></svg>Sped up</div><div id="badge">Sample data · fictional names</div></div>
<div id="cap"><div id="capp"></div></div>
<div id="prog"></div>
</div>
<audio id="aud" src="narration.m4a" preload="auto"></audio>
<script src="vendor/gsap.min.js"></script>
<script src="data.js"></script>
<script src="timeline.js"></script>
<script src="scenes.js"></script>
</body>
</html>
